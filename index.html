<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Python Edition</title>
    <!-- PyScript WebAssembly Engine -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <!-- Three.js Graphics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; overflow: hidden; background: #78A7FF; font-family: 'Segoe UI', Tahoma, sans-serif; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.9);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #hud {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            pointer-events: none; z-index: 5;
        }
        #status-bars { display: flex; justify-content: space-between; width: 364px; }
        .bar-group { display: flex; gap: 2px; }
        .heart { width: 14px; height: 14px; background: #E71C24; border: 2px solid #000; }
        .heart.lost { background: #333; }
        .drumstick { width: 14px; height: 14px; background: #C67A32; border: 2px solid #000; }

        #hotbar {
            display: flex; background: #8F8F8F; padding: 3px;
            border: 3px solid #3C3C3C;
        }
        .slot {
            width: 40px; height: 40px; background: #8B8B8B;
            border: 2px solid #373737; border-right-color: #FFF; border-bottom-color: #FFF;
            display: flex; align-items: center; justify-content: center; margin: 1px;
        }
        .slot.active { border: 3px solid #FFFFFF; margin: 0px; width: 42px; height: 42px; }
        .slot-inner { width: 26px; height: 26px; border: 1px solid rgba(0,0,0,0.3); }

        #overlay, #options-menu {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 10px; z-index: 20; color: #FFF;
        }
        .hidden { display: none !important; }
        
        .mc-title { font-size: 26px; text-shadow: 2px 2px #222; font-weight: bold; margin-bottom: 6px; }
        .mc-btn {
            width: 320px; padding: 10px 0; background: #707070; color: #E0E0E0;
            font-size: 15px; text-align: center; font-weight: bold;
            border: 2px solid #000; box-shadow: inset 2px 2px #AEAEAE, inset -2px -2px #3A3A3A;
            cursor: pointer;
        }
        .mc-btn:hover { background: #7C8BCE; color: #FFF; }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            width: 320px; font-size: 14px;
        }
        input[type=range] { width: 160px; accent-color: #707070; }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hud">
        <div id="status-bars">
            <div class="bar-group" id="hearts-box"></div>
            <div class="bar-group" id="food-box"></div>
        </div>
        <div id="hotbar"></div>
    </div>

    <div id="overlay">
        <div class="mc-title">Game Menu</div>
        <div class="mc-btn" id="resume-btn">Back to Game</div>
        <div class="mc-btn" id="options-btn">Options...</div>
        <div class="mc-btn" id="respawn-btn">Respawn</div>
    </div>

    <div id="options-menu" class="hidden">
        <div class="mc-title">Options</div>
        <div class="setting-row">
            <label id="fov-label">FOV: 75</label>
            <input type="range" id="fov-slider" min="60" max="110" value="75">
        </div>
        <div class="setting-row">
            <label id="render-label">Render Distance: 2</label>
            <input type="range" id="render-slider" min="1" max="4" value="2">
        </div>
        <div class="setting-row">
            <label id="light-label">Brightness: 80%</label>
            <input type="range" id="light-slider" min="20" max="100" value="80">
        </div>
        <div class="mc-btn" id="options-done-btn" style="margin-top: 10px;">Done</div>
    </div>

    <script type="py">
import json
from js import THREE, document, window, Math, WebSocket
from pyodide.ffi import create_proxy

# --- PROCEDURAL TEXTURES ---
def make_noise_tex(base_r, base_g, base_b, noise=15):
    canvas = document.createElement('canvas')
    canvas.width = 16
    canvas.height = 16
    ctx = canvas.getContext('2d')
    for x in range(16):
        for y in range(16):
            n = Math.floor((Math.random() - 0.5) * noise * 2)
            r = Math.max(0, Math.min(255, base_r + n))
            g = Math.max(0, Math.min(255, base_g + n))
            b = Math.max(0, Math.min(255, base_b + n))
            ctx.fillStyle = f"rgb({r},{g},{b})"
            ctx.fillRect(x, y, 1, 1)
    tex = THREE.CanvasTexture.new(canvas)
    tex.magFilter = THREE.NearestFilter
    tex.minFilter = THREE.NearestFilter
    return tex

def get_mat(r, g, b, noise=15):
    m = THREE.MeshLambertMaterial.new()
    m.map = make_noise_tex(r, g, b, noise)
    return m

MATERIALS = {
    1: get_mat(86, 125, 44, 18),   # Grass
    2: get_mat(134, 96, 67, 16),   # Dirt
    3: get_mat(112, 112, 112, 20), # Stone
    4: get_mat(102, 81, 52, 12),   # Wood
    5: get_mat(40, 90, 20, 22),    # Leaves
    6: get_mat(194, 157, 98, 14)   # Planks
}

BLOCK_HEX = { 1: "#567D2C", 2: "#866043", 3: "#707070", 4: "#665134", 5: "#285A14", 6: "#C29D62" }

# --- SCENE & CAMERA ---
scene = THREE.Scene.new()
scene.background = THREE.Color.new(0x78A7FF)

camera = THREE.PerspectiveCamera.new(75, window.innerWidth / window.innerHeight, 0.1, 150)
renderer = THREE.WebGLRenderer.new()
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

ambient_light = THREE.AmbientLight.new(0xFFFFFF, 0.8)
scene.add(ambient_light)
sun = THREE.DirectionalLight.new(0xFFFFFF, 0.6)
sun.position.set(50, 100, 50)
scene.add(sun)

# --- CHUNKS & VOXEL ENGINE ---
CHUNK_SIZE = 6
RENDER_DISTANCE = 2
chunks = {}
world_voxels = {}
voxel_geo = THREE.BoxGeometry.new(1, 1, 1)

def get_elevation(x, z):
    return int(Math.sin(x / 6) * 2 + Math.cos(z / 6) * 2)

def add_voxel(x, y, z, block_type, sync=False):
    pos_key = f"{x},{y},{z}"
    if pos_key in world_voxels:
        return
    mesh = THREE.Mesh.new(voxel_geo, MATERIALS[block_type])
    mesh.position.set(x, y, z)
    mesh.block_type = block_type
    mesh.grid_pos = (x, y, z)
    scene.add(mesh)
    world_voxels[pos_key] = mesh

    if sync and ws_connected:
        send_socket_message({
            "type": "block_update",
            "x": x, "y": y, "z": z,
            "action": "place",
            "block_type": block_type
        })

def remove_voxel(x, y, z, sync=False):
    pos_key = f"{x},{y},{z}"
    if pos_key in world_voxels:
        mesh = world_voxels[pos_key]
        scene.remove(mesh)
        del world_voxels[pos_key]

        if sync and ws_connected:
            send_socket_message({
                "type": "block_update",
                "x": x, "y": y, "z": z,
                "action": "break"
            })

def generate_chunk(cx, cz):
    chunk_key = f"{cx},{cz}"
    if chunk_key in chunks:
        return
    chunks[chunk_key] = True

    for x in range(cx * CHUNK_SIZE, (cx + 1) * CHUNK_SIZE):
        for z in range(cz * CHUNK_SIZE, (cz + 1) * CHUNK_SIZE):
            h = get_elevation(x, z)
            add_voxel(x, h, z, 1)
            add_voxel(x, h - 1, z, 2)
            add_voxel(x, h - 2, z, 3)

            if (x % 9 == 0) and (z % 9 == 0):
                for ty in range(1, 4): add_voxel(x, h + ty, z, 4)
                for lx in range(-1, 2):
                    for lz in range(-1, 2):
                        if lx != 0 or lz != 0:
                            add_voxel(x + lx, h + 3, z + lz, 5)

def update_chunks_around_player(px, pz):
    current_cx = int(Math.floor(px / CHUNK_SIZE))
    current_cz = int(Math.floor(pz / CHUNK_SIZE))

    for dx in range(-RENDER_DISTANCE, RENDER_DISTANCE + 1):
        for dz in range(-RENDER_DISTANCE, RENDER_DISTANCE + 1):
            generate_chunk(current_cx + dx, current_cz + dz)

# --- STEVE AVATAR FACTORY ---
skin_mat = THREE.MeshLambertMaterial.new()
skin_mat.color = THREE.Color.new(0xD29B72)

shirt_mat = THREE.MeshLambertMaterial.new()
shirt_mat.color = THREE.Color.new(0x00AFAF)

pants_mat = THREE.MeshLambertMaterial.new()
pants_mat.color = THREE.Color.new(0x283890)

hair_mat = THREE.MeshLambertMaterial.new()
hair_mat.color = THREE.Color.new(0x422A14)

def create_steve_avatar():
    group = THREE.Group.new()
    
    # Head
    head = THREE.Mesh.new(THREE.BoxGeometry.new(0.5, 0.5, 0.5), skin_mat)
    head.position.set(0, 0.55, 0)
    group.add(head)
    
    # Hair
    hair = THREE.Mesh.new(THREE.BoxGeometry.new(0.52, 0.2, 0.52), hair_mat)
    hair.position.set(0, 0.72, 0)
    group.add(hair)
    
    # Torso (Shirt)
    body = THREE.Mesh.new(THREE.BoxGeometry.new(0.5, 0.75, 0.25), shirt_mat)
    body.position.set(0, -0.075, 0)
    group.add(body)
    
    # Left Arm
    l_arm = THREE.Mesh.new(THREE.BoxGeometry.new(0.22, 0.75, 0.22), skin_mat)
    l_arm.position.set(-0.36, -0.075, 0)
    group.add(l_arm)
    
    # Right Arm
    r_arm = THREE.Mesh.new(THREE.BoxGeometry.new(0.22, 0.75, 0.22), skin_mat)
    r_arm.position.set(0.36, -0.075, 0)
    group.add(r_arm)
    
    # Left Leg
    l_leg = THREE.Mesh.new(THREE.BoxGeometry.new(0.23, 0.75, 0.23), pants_mat)
    l_leg.position.set(-0.13, -0.825, 0)
    group.add(l_leg)
    
    # Right Leg
    r_leg = THREE.Mesh.new(THREE.BoxGeometry.new(0.23, 0.75, 0.23), pants_mat)
    r_leg.position.set(0.13, -0.825, 0)
    group.add(r_leg)
    
    return group

# --- SECURE WEBSOCKETS ---
ws = None
ws_connected = False
other_players = {}

def send_socket_message(payload):
    if ws and ws.readyState == 1:
        ws.send(json.dumps(payload))

def on_ws_open(e):
    global ws_connected
    ws_connected = True

def on_ws_message(e):
    data = json.loads(e.data)
    msg_type = data.get("type")

    if msg_type == "init":
        spawn = data.get("spawn")
        if spawn:
            player_pos.set(spawn["x"], spawn["y"], spawn["z"])
            camera.position.set(spawn["x"], spawn["y"] + 0.6, spawn["z"])

        players = data.get("players", {})
        for pid, p in players.items():
            avatar = create_steve_avatar()
            avatar.position.set(p["x"], p["y"], p["z"])
            scene.add(avatar)
            other_players[pid] = avatar

        diff = data.get("world_diff", {})
        for key, item in diff.items():
            coords = [int(n) for n in key.split(",")]
            if item["action"] == "break":
                remove_voxel(coords[0], coords[1], coords[2])
            elif item["action"] == "place":
                add_voxel(coords[0], coords[1], coords[2], item["type"])

    elif msg_type == "player_join":
        pid = data["id"]
        avatar = create_steve_avatar()
        avatar.position.set(data["x"], data["y"], data["z"])
        scene.add(avatar)
        other_players[pid] = avatar

    elif msg_type == "player_move":
        pid = data["id"]
        if pid not in other_players:
            avatar = create_steve_avatar()
            scene.add(avatar)
            other_players[pid] = avatar
        
        avatar = other_players[pid]
        avatar.position.set(data["x"], data["y"], data["z"])
        if "rot" in data:
            avatar.rotation.y = data["rot"]

    elif msg_type == "player_leave":
        pid = data["id"]
        if pid in other_players:
            scene.remove(other_players[pid])
            del other_players[pid]

    elif msg_type == "block_update":
        if data["action"] == "break":
            remove_voxel(data["x"], data["y"], data["z"])
        elif data["action"] == "place":
            add_voxel(data["x"], data["y"], data["z"], data["block_type"])

try:
    # Set to your Cloudflare trycloudflare domain
    ws = WebSocket.new("wss://basement-things-out-techniques.trycloudflare.com")
    ws.onopen = create_proxy(on_ws_open)
    ws.onmessage = create_proxy(on_ws_message)
except Exception:
    pass

# --- CONTROLS & PHYSICS ---
player_pos = THREE.Vector3.new(0, 6, 0)
velocity = THREE.Vector3.new(0, 0, 0)
is_grounded = False
health = 10
selected_slot = 1

controls = THREE.PointerLockControls.new(camera, document.body)
camera.position.set(0, 6.6, 0)

keys = {"w": False, "s": False, "a": False, "d": False, "space": False}

def on_key_down(e):
    global selected_slot
    k = e.code
    if k == "KeyW": keys["w"] = True
    elif k == "KeyS": keys["s"] = True
    elif k == "KeyA": keys["a"] = True
    elif k == "KeyD": keys["d"] = True
    elif k == "Space": keys["space"] = True
    
    if e.key in ["1", "2", "3", "4", "5", "6"]:
        selected_slot = int(e.key)
        for i in range(1, 7):
            document.getElementById(f"slot-{i}").classList.remove("active")
        document.getElementById(f"slot-{selected_slot}").classList.add("active")

def on_key_up(e):
    k = e.code
    if k == "KeyW": keys["w"] = False
    elif k == "KeyS": keys["s"] = False
    elif k == "KeyA": keys["a"] = False
    elif k == "KeyD": keys["d"] = False
    elif k == "Space": keys["space"] = False

document.addEventListener("keydown", create_proxy(on_key_down))
document.addEventListener("keyup", create_proxy(on_key_up))

# Raycasting
raycaster = THREE.Raycaster.new()
screen_center = THREE.Vector2.new(0, 0)

def on_mouse_down(e):
    if not controls.isLocked: return
    raycaster.setFromCamera(screen_center, camera)
    
    px, py, pz = player_pos.x, player_pos.y, player_pos.z
    targets = [
        v for v in world_voxels.values() 
        if abs(v.position.x - px) <= 6 and abs(v.position.z - pz) <= 6 and abs(v.position.y - py) <= 6
    ]
    
    hits = raycaster.intersectObjects(targets)
    
    if len(hits) > 0 and hits[0].distance < 7:
        hit = hits[0]
        gp = hit.object.grid_pos
        
        if e.button == 0:
            remove_voxel(gp[0], gp[1], gp[2], sync=True)
        elif e.button == 2:
            norm = hit.face.normal
            nx = gp[0] + int(Math.round(norm.x))
            ny = gp[1] + int(Math.round(norm.y))
            nz = gp[2] + int(Math.round(norm.z))
            
            p_gx = int(Math.floor(player_pos.x + 0.5))
            p_gy = int(Math.floor(player_pos.y + 0.5))
            p_gz = int(Math.floor(player_pos.z + 0.5))
            
            if not (nx == p_gx and (ny == p_gy or ny == p_gy - 1) and nz == p_gz):
                add_voxel(nx, ny, nz, selected_slot, sync=True)

document.addEventListener("mousedown", create_proxy(on_mouse_down))
document.addEventListener("contextmenu", create_proxy(lambda e: e.preventDefault()))

# --- HUD & MENUS ---
hearts_box = document.getElementById("hearts-box")
for i in range(10):
    h = document.createElement("div")
    h.className = "heart"
    hearts_box.appendChild(h)

food_box = document.getElementById("food-box")
for i in range(10):
    f = document.createElement("div")
    f.className = "drumstick"
    food_box.appendChild(f)

hotbar = document.getElementById("hotbar")
for i in range(1, 7):
    slot = document.createElement("div")
    slot.className = f"slot {'active' if i == 1 else ''}"
    slot.id = f"slot-{i}"
    inner = document.createElement("div")
    inner.className = "slot-inner"
    inner.style.background = BLOCK_HEX[i]
    slot.appendChild(inner)
    hotbar.appendChild(slot)

def update_hearts_hud():
    h_nodes = document.querySelectorAll(".heart")
    for idx, node in enumerate(h_nodes):
        if idx < health: node.classList.remove("lost")
        else: node.classList.add("lost")

overlay = document.getElementById("overlay")
options_menu = document.getElementById("options-menu")

def toggle_menu(lock):
    if lock: controls.lock()
    else: controls.unlock()

document.getElementById("resume-btn").addEventListener("click", create_proxy(lambda e: toggle_menu(True)))
controls.addEventListener("lock", create_proxy(lambda e: overlay.classList.add("hidden")))
controls.addEventListener("unlock", create_proxy(lambda e: overlay.classList.remove("hidden")))

def respawn(e=None):
    global health
    health = 10
    update_hearts_hud()
    player_pos.set(0, 6, 0)
    velocity.set(0, 0, 0)
    toggle_menu(True)

document.getElementById("respawn-btn").addEventListener("click", create_proxy(respawn))

def open_options(e):
    overlay.classList.add("hidden")
    options_menu.classList.remove("hidden")

def close_options(e):
    options_menu.classList.add("hidden")
    overlay.classList.remove("hidden")

document.getElementById("options-btn").addEventListener("click", create_proxy(open_options))
document.getElementById("options-done-btn").addEventListener("click", create_proxy(close_options))

fov_slider = document.getElementById("fov-slider")
def update_fov(e):
    val = int(fov_slider.value)
    camera.fov = val
    camera.updateProjectionMatrix()
    document.getElementById("fov-label").innerText = f"FOV: {val}"
fov_slider.addEventListener("input", create_proxy(update_fov))

render_slider = document.getElementById("render-slider")
def update_render(e):
    global RENDER_DISTANCE
    RENDER_DISTANCE = int(render_slider.value)
    document.getElementById("render-label").innerText = f"Render Distance: {RENDER_DISTANCE}"
render_slider.addEventListener("input", create_proxy(update_render))

light_slider = document.getElementById("light-slider")
def update_light(e):
    val = int(light_slider.value) / 100
    ambient_light.intensity = val
    document.getElementById("light-label").innerText = f"Brightness: {int(val * 100)}%"
light_slider.addEventListener("input", create_proxy(update_light))

# --- GAME LOOP ---
def block_at(x, y, z):
    return f"{int(Math.floor(x + 0.5))},{int(Math.floor(y + 0.5))},{int(Math.floor(z + 0.5))}" in world_voxels

void_timer = 0.0
network_sync_timer = 0.0
chunk_tick = 0

def game_loop(timestamp):
    global is_grounded, void_timer, health, network_sync_timer, chunk_tick
    dt = 0.016

    if controls.isLocked:
        chunk_tick += 1
        if chunk_tick % 12 == 0:
            update_chunks_around_player(player_pos.x, player_pos.z)

        forward = THREE.Vector3.new()
        camera.getWorldDirection(forward)
        forward.y = 0
        forward.normalize()
        
        right = THREE.Vector3.new()
        right.crossVectors(forward, THREE.Vector3.new(0, 1, 0)).normalize()
        
        move_vec = THREE.Vector3.new(0, 0, 0)
        if keys["w"]: move_vec.add(forward)
        if keys["s"]: move_vec.sub(forward)
        if keys["d"]: move_vec.add(right)
        if keys["a"]: move_vec.sub(right)
        move_vec.normalize()

        speed = 5.5
        velocity.x = move_vec.x * speed
        velocity.z = move_vec.z * speed
        velocity.y -= 22.0 * dt

        if keys["space"] and is_grounded:
            velocity.y = 7.5
            is_grounded = False

        new_x = player_pos.x + velocity.x * dt
        if not (block_at(new_x + 0.3, player_pos.y, player_pos.z) or block_at(new_x - 0.3, player_pos.y, player_pos.z)):
            player_pos.x = new_x

        new_z = player_pos.z + velocity.z * dt
        if not (block_at(player_pos.x, player_pos.y, new_z + 0.3) or block_at(player_pos.x, player_pos.y, new_z - 0.3)):
            player_pos.z = new_z

        new_y = player_pos.y + velocity.y * dt
        if velocity.y < 0 and block_at(player_pos.x, new_y - 0.9, player_pos.z):
            player_pos.y = Math.floor(player_pos.y) + 0.4
            velocity.y = 0
            is_grounded = True
        else:
            player_pos.y = new_y
            is_grounded = False

        camera.position.set(player_pos.x, player_pos.y + 0.6, player_pos.z)

        # Network update throttle (sends position & yaw angle)
        network_sync_timer += dt
        if network_sync_timer > 0.15 and ws_connected:
            send_socket_message({
                "type": "move",
                "x": player_pos.x,
                "y": player_pos.y,
                "z": player_pos.z,
                "rot": camera.rotation.y
            })
            network_sync_timer = 0

        # Void damage
        if player_pos.y < -15:
            void_timer += dt
            if void_timer >= 0.8:
                health -= 1
                void_timer = 0
                update_hearts_hud()
                if health <= 0: respawn()

    renderer.render(scene, camera)
    window.requestAnimationFrame(proxy_loop)

proxy_loop = create_proxy(game_loop)
window.requestAnimationFrame(proxy_loop)
    </script>
</body>
</html>
